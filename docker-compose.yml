services:
  orbiflow:
    # To pull the prebuilt multi-arch image from GitHub Container Registry instead of building locally:
    # image: ghcr.io/<owner>/<repo>:latest
    build: .
    container_name: orbiflow-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
